plugins {
    id 'com.android.application'
}
android {
    namespace 'ir.abzar.sanat'
    compileSdk 34
    defaultConfig {
        applicationId 'ir.abzar.sanat'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.3'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
